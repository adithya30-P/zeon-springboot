<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{home}">
<head><title layout:fragment="title">Test Result | Zeon Skill</title></head>
<body>

<div layout:fragment="header">
<header id="mainHeader" class="position-fixed top-0 start-0 w-100 z-3">
  <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm border-0">
    <div class="container">
      <a class="navbar-brand" th:href="@{/home}">
        <img th:src="@{/images/zeonskill.png}" alt="Zeon Skill Logo" class="img-fluid" style="max-height: 40px;">
      </a>
      <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end d-lg-none" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <a class="navbar-brand" th:href="@{/home}">
            <img th:src="@{/images/zeonskill.png}" alt="Zeon Skill Logo" class="img-fluid" style="max-height: 40px;">
          </a>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <div class="dropdown mb-4">
            <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="offcanvasProfileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <img th:src="@{/images/profile-user.png}" alt="Profile" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
              <span class="ms-2 fw-semibold" th:text="${sessionUsername}"></span>
            </a>
            <ul class="dropdown-menu" aria-labelledby="offcanvasProfileDropdown">
              <li><a class="dropdown-item" th:href="@{/viewresult}">View result</a></li>
              <li><a class="dropdown-item text-danger" th:href="@{/logout}">Logout</a></li>
            </ul>
          </div>
          <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 mb-3">
            <li class="nav-item"><a class="nav-link custom-nav-link active" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link custom-nav-link" href="#">Why Choose Us</a></li>
            <li class="nav-item"><a class="nav-link custom-nav-link" th:href="@{/popularquiz}">Popular Quiz</a></li>
          </ul>
        </div>
      </div>
      <div class="collapse navbar-collapse d-none d-lg-flex justify-content-end align-items-center">
        <ul class="navbar-nav me-3">
          <li class="nav-item"><a class="nav-link custom-nav-link active" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link custom-nav-link" href="#">Why Choose Us</a></li>
          <li class="nav-item"><a class="nav-link custom-nav-link" th:href="@{/popularquiz}">Popular Quiz</a></li>
        </ul>
        <div class="dropdown">
          <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{/images/profile-user.png}" alt="Profile" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
            <span class="ms-2 fw-semibold" th:text="${sessionUsername}"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
            <li><a class="dropdown-item" th:href="@{/viewresult}">View result</a></li>
            <li><a class="dropdown-item text-danger" th:href="@{/logout}">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
</div>

<div layout:fragment="content">
<section class="mt-5 py-4">
  <div class="container">
    <div class="card shadow border-0 rounded-4 bg-white">
      <div class="card-body p-4 p-md-5">
        <h3 class="mb-1"><span th:text="${skill?.name}"></span> Test</h3>
        <p class="text-muted mb-3" style="font-size:0.95rem">Total Questions: <span th:text="${total}"></span></p>

        <div class="d-flex flex-column align-items-start gap-2">
          <div class="fs-6">Score: <strong><span th:text="${score}"></span> / <span th:text="${total}"></span></strong></div>
          <div>
            <span class="text-muted me-2" style="font-size:0.95rem">Status:</span>
            <span th:if="${passed}" class="badge rounded-pill bg-success px-3 py-2">Passed</span>
            <span th:if="${passed != null and !passed}" class="badge rounded-pill bg-danger px-3 py-2">Failed</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="py-3">
  <div class="container">
    <div class="card shadow border-0 rounded-4 bg-white">
      <div class="card-body p-4 p-md-5">
        <h6 class="mb-3">Answer Review</h6>
        <div class="table-responsive">
          <table class="table table-bordered align-middle mb-0">
            <thead class="table-light">
              <tr><th style="width:70px">Q.No</th><th>Question</th><th style="min-width:160px">Your Answer</th><th style="min-width:170px">Correct Answer</th><th style="width:130px">Result</th></tr>
            </thead>
            <tbody>
              <tr th:each="q, qStat : ${results}">
                <td th:text="${qStat.count}"></td>
                <td th:text="${q.question}"></td>
                <td th:text="${q.userAnswer}"></td>
                <td th:text="${q.correctAnswer}"></td>
                <td th:class="${q.correct} ? 'text-success fw-semibold' : 'text-danger fw-semibold'">
                  <span th:if="${q.correct}">&#10003; Correct</span>
                  <span th:unless="${q.correct}"><span aria-hidden="true">&times;</span> Wrong</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
</div>
</body>
</html>
