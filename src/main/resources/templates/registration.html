<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{home}">
<head><title layout:fragment="title">Register | Zeon Skill</title></head>
<body>
<div layout:fragment="header"></div>
<div layout:fragment="footer"></div>

<div layout:fragment="content">
<section class="w-100 px-3 d-flex justify-content-center align-items-center"
    style="min-height:100vh; background-color:#f8f9fa;">
    <div class="card p-4 mx-auto" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <a th:href="@{/home}">
                <img th:src="@{/images/zeonskill.png}" alt="zeonskill" class="mb-3 img-fluid" style="max-width: 120px;">
            </a>
            <h3 class="card-title mt-2">Register</h3>
            <p>Create a new account</p>
        </div>

        <div th:each="msg : ${flashMessages}" th:class="'alert alert-' + ${msg.category} + ' text-center'" role="alert">
            <span th:text="${msg.message}"></span>
        </div>

        <form th:action="@{/registration}" method="post">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="Your full name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <div class="d-grid">
                <button class="btn-login" type="submit">Register</button>
            </div>
        </form>

        <p class="mt-3 text-center">
            Already have an account?
            <a th:href="@{/}">Login here</a>
        </p>
    </div>
</section>
</div>
</body>
</html>
