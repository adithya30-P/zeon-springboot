<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin_dashboard}">
<head><title layout:fragment="title">Skill results - Zeon Skill</title></head>
<body>
<div layout:fragment="main">

<div class="d-flex flex-row justify-content-between">
  <h3 class="Categories">User Results</h3>
</div>

<div class="skills-card mb-4">
  <div class="section-header d-flex justify-content-between align-items-center"></div>
  <div class="table-responsive">
    <table class="custom-table category-table">
      <thead>
        <tr>
          <th>User ID</th><th>Name</th><th>Email</th><th>Skill</th>
          <th>Score</th><th>Percentage</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="us : ${userScores}">
          <td th:text="${us.userId}"></td>
          <td th:text="${us.userName}"></td>
          <td th:text="${us.userEmail}"></td>
          <!-- NOTE: the original UserScore model has no `skill` relationship,
               so this column always fell back to the literal "Python" in the
               source project. Preserved as-is here. -->
          <td>Python</td>
          <td th:text="${us.score} + ' / ' + ${us.total}"></td>
          <td th:text="${us.percentage} + '%'"></td>
          <td>
            <span th:if="${us.percentage >= 40}" class="badge bg-success">Pass</span>
            <span th:unless="${us.percentage >= 40}" class="badge bg-danger">Fail</span>
          </td>
          <td>
            <a th:href="@{/admin_viewresults}"><button class="btn btn-info text-white">View</button></a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</div>
</body>
</html>
