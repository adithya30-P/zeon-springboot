# ===================================================================
# Zeon Skills - Spring Boot backend configuration
# Original Flask project used: sqlite:///users.db
# This backend targets MySQL, as per the project requirement.
# ===================================================================

spring.application.name=zeon-skills

# ---- MySQL connection ----
# Create the database first:  CREATE DATABASE zeon_skills;
spring.datasource.url=jdbc:mysql://localhost:3306/zeon_skills?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Adithya3355
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from the entities below on startup.
# Fine for development. Switch to 'validate' once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Session ----
# Matches the Flask config: app.config['PERMANENT_SESSION_LIFETIME'] = timedelta(minutes=180)
server.servlet.session.timeout=180m

server.port=8080
